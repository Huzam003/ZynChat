worker_processes 1;

# Absolute paths for this specific environment
error_log /home/we/.gemini/antigravity/scratch/nexachat/nexachat-main/nginx/logs/error.log warn;
pid /home/we/.gemini/antigravity/scratch/nexachat/nexachat-main/nginx/temp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /home/we/.gemini/antigravity/scratch/nexachat/nexachat-main/nginx/logs/access.log;

    client_body_temp_path /home/we/.gemini/antigravity/scratch/nexachat/nexachat-main/nginx/temp/body;
    proxy_temp_path /home/we/.gemini/antigravity/scratch/nexachat/nexachat-main/nginx/temp/proxy;
    fastcgi_temp_path /home/we/.gemini/antigravity/scratch/nexachat/nexachat-main/nginx/temp/fastcgi;
    uwsgi_temp_path /home/we/.gemini/antigravity/scratch/nexachat/nexachat-main/nginx/temp/uwsgi;
    scgi_temp_path /home/we/.gemini/antigravity/scratch/nexachat/nexachat-main/nginx/temp/scgi;

    # ─── Security: Rate Limiting ──────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=zyn_limit:10m rate=15r/s;

    # ─── Upstreams ────────────────────────────────────────────────────────────
    upstream zynchat_app {
        server 127.0.0.1:3001; 
    }

    upstream sw_collector {
        server 127.0.0.1:3002;
    }

    server {
        listen 8080;
        server_name localhost;

        server_tokens off;
        client_max_body_size 10M;

        # ─── Security Headers ─────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';" always;

        # ─── Nginx -> ShieldWatch Reporting ───────────────────────────────────
        error_page 403 /api/security/nginx-block?reason=bot;
        error_page 429 /api/security/nginx-block?reason=rate-limit;
        proxy_intercept_errors on;

        # ─── Route: ShieldWatch Management Dashboard ──────────────────────────
        location /dashboard/ {
            proxy_pass http://sw_collector/; 
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect / /dashboard/;
        }

        location /dashboard/api/ {
            proxy_pass http://sw_collector/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /sw.io/ {
            proxy_pass http://sw_collector/sw.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # ─── Route: ZynChat App ──────────────────────────────────────────────
        location / {
            # Bot Blocking
            if ($http_user_agent ~* (sqlmap|nikto|dirbuster|nmap|metasploit)) {
                return 403;
            }

            limit_req zone=zyn_limit burst=20 nodelay;

            proxy_pass http://zynchat_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /socket.io/ {
            proxy_pass http://zynchat_app/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        location /api/security/ {
            proxy_intercept_errors off;
            proxy_pass http://zynchat_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
