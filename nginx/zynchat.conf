worker_processes 1;
error_log /home/we/.gemini/antigravity/scratch/nexachat/nexachat-main/nginx/error.log warn;
pid /home/we/.gemini/antigravity/scratch/nexachat/nexachat-main/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Security: Logging ───────────────────────────────────────────────────
    access_log /home/we/.gemini/antigravity/scratch/nexachat/nexachat-main/nginx/access.log;

    client_body_temp_path /home/we/.gemini/antigravity/scratch/nexachat/nexachat-main/nginx/body;
    proxy_temp_path /home/we/.gemini/antigravity/scratch/nexachat/nexachat-main/nginx/proxy;
    fastcgi_temp_path /home/we/.gemini/antigravity/scratch/nexachat/nexachat-main/nginx/fastcgi;
    uwsgi_temp_path /home/we/.gemini/antigravity/scratch/nexachat/nexachat-main/nginx/uwsgi;
    scgi_temp_path /home/we/.gemini/antigravity/scratch/nexachat/nexachat-main/nginx/scgi;

    # ─── Security: Rate Limiting ──────────────────────────────────────────────
    # Limit to 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    upstream zynchat_backend {
        server 127.0.0.1:3001;
    }

    server {
        listen 8080;
        server_name localhost;

        # ─── Security: Hardening ──────────────────────────────────────────────
        server_tokens off; # Hide Nginx version
        client_max_body_size 5M; # Prevent large payload attacks

        # ─── Security: Headers ────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors 'self';" always;

        # ─── Security: Bot Blocking ───────────────────────────────────────────
        if ($http_user_agent ~* (sqlmap|nikto|dirbuster|metasploit|nmap|brutus|hydra)) {
            return 403;
        }

        # ─── Proxy to Node.js App ─────────────────────────────────────────────
        location / {
            limit_req zone=mylimit burst=20 nodelay;

            proxy_pass http://zynchat_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;

            # Security: Timeout settings to prevent slowloris
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
